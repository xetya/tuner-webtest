<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3949">
<title>TUNER</title>

<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="tuner">

    <main class="stage">
      <video id="player" playsinline></video>

      <div class="topbar">
        <div class="brand"><span class="dot"></span> TUNER</div>
        <button id="fullscreen" class="iconbtn" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button id="channelsBtn" class="iconbtn" title="Channels" aria-label="Channels">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
        </button>
        <button id="settingsBtn" class="iconbtn" title="Playlists" aria-label="Playlists">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>

      <div id="status" class="status">Ready</div>

      <div class="swipe-hint">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        swipe
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </div>

      <div id="osd" class="osd">
        <div class="osd-card">
          <div id="osdLogo" class="osd-logo"></div>
          <div id="osdNum" class="osd-num">1/1</div>
          <div class="osd-text">
            <div id="osdName" class="osd-name">—</div>
            <div id="osdGroup" class="osd-group"></div>
          </div>
        </div>
      </div>
    </main>

    <aside id="drawer" class="drawer">
      <div class="drawer-head">
        <h2>Channels <span id="count">0 channels</span> <button id="drawerClose" class="iconbtn" style="width:34px;height:34px" aria-label="Close">✕</button></h2>
        <input id="search" placeholder="Search channel…" autocomplete="off">
      </div>
      <div id="channels"></div>
      <div class="drawer-foot">↑/↓ browse · Enter select · Esc close</div>
    </aside>

  </div>

  <!-- Playlist manager -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <button id="settingsClose" class="modal-close" aria-label="Close">✕</button>
      <h2>Playlists</h2>
      <p class="sub">Playlists you add here are saved permanently in this browser and reload automatically next time.</p>

      <label class="field" for="playlistUrl">Add from URL</label>
      <div class="row">
        <input id="playlistUrl" type="url" placeholder="https://example.com/playlist.m3u8">
        <button id="addUrlBtn" class="btn primary" style="flex:0 0 auto">Load</button>
      </div>

      <label class="field">Add from file</label>
      <label class="btn filebtn" style="display:flex">
        Choose .m3u / .m3u8 file
        <input id="playlistFile" type="file" accept=".m3u,.m3u8,.txt" style="display:none">
      </label>

      <div class="divider"></div>
      <label class="field" style="margin-top:0">Saved playlists</label>
      <div id="savedPlaylists" class="saved-playlists"></div>
    </div>
  </div>

  <!-- CDN player engines -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <!-- Optional Smart TV remote keycode overrides (VIDAA/Hisense). Safe no-op
       on regular browsers/desktop TVs; app.js merges in a few common
       equivalents (Page Up/Down, LG webOS) on its own either way. -->
  <script>window.aButtons = window.aButtons || {};</script>
  <script src="assets/js/pm3u-control-vidaa.js"></script>

  <!-- UI strings (only the "en" entries are wired into the app for now) -->
  <script src="assets/js/pm3u-lang.js"></script>

  <!-- Standalone app -->
  <script src="assets/js/app.js"></script>
</body>
</html>
