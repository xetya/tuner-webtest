<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TUNER</title>

  <!-- Existing PM3U styles supplied with the project -->
  <link rel="stylesheet" href="assets/css/pm3u-player.css">
  <link rel="stylesheet" href="assets/css/pm3u-epg.css">
  <link rel="stylesheet" href="assets/css/pm3u-control.css">

  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff}
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif!important;overflow:hidden}
    .tuner{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh}
    .stage{position:relative;background:#000;min-width:0}
    #player{width:100%;height:100%;object-fit:contain;background:#000}
    .topbar{position:absolute;z-index:10;left:0;right:0;top:0;padding:14px;display:flex;gap:8px;align-items:center;background:linear-gradient(#000b,transparent)}
    .topbar input{margin:0;padding:11px 12px;font-size:14px;width:auto}
    .topbar .url{flex:1;min-width:80px}
    .topbar button{width:auto;margin:0;padding:11px 14px;font-size:14px}
    .status{position:absolute;left:16px;bottom:14px;z-index:5;background:#0009;border-radius:8px;padding:8px 12px;font-size:13px}
    .side{background:#17181b;border-left:1px solid #333;display:flex;flex-direction:column;min-width:0}
    .side-head{padding:16px;border-bottom:1px solid #333}
    .side-head h2{margin:0 0 5px;font-size:20px}
    #search{margin:10px 0 0;padding:11px 12px;font-size:14px}
    #channels{overflow:auto;padding:8px}
    .channel{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:#24262a;border:0;color:#fff;padding:9px;margin:0 0 5px;border-radius:7px;cursor:pointer}
    .channel.active{background:var(--theme-highlight,#118599)}
    .channel img{width:42px;height:42px;object-fit:contain;flex:0 0 42px}
    .channel span{min-width:0;display:flex;flex-direction:column;gap:2px}
    .channel b,.channel small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .channel small{opacity:.65}
    .footer{padding:10px 16px;font-size:12px;opacity:.6;border-top:1px solid #333}
    @media(max-width:800px){
      .tuner{grid-template-columns:1fr}
      .stage{height:58vh}
      .side{height:42vh}
      .topbar{flex-wrap:wrap}
      .topbar .url{min-width:100%;order:3}
    }
  </style>
</head>
<body>
  <div class="tuner">
    <main class="stage">
      <video id="player" playsinline controls></video>
      <div class="topbar">
        <input id="playlist-url" class="url" placeholder="M3U playlist URL">
        <button id="load-url">Load URL</button>
        <label class="selector" style="width:auto;margin:0;padding:11px 14px">
          M3U file
          <input id="playlist-file" type="file" accept=".m3u,.m3u8,.txt" style="display:none">
        </label>
        <button id="fullscreen">Fullscreen</button>
      </div>
      <div id="status" class="status">Ready</div>
    </main>

    <aside class="side">
      <div class="side-head">
        <h2>TUNER</h2>
        <div id="count">0 channels</div>
        <input id="search" placeholder="Search channel…">
      </div>
      <div id="channels"></div>
      <div class="footer">Browser standalone build</div>
    </aside>
  </div>

  <!-- CDN player engines used by the browser build -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <!-- Standalone browser app -->
  <script src="assets/js/app.js"></script>
</body>
</html>
